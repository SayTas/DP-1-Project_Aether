<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aether — Command</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./composer-effects.css">
    <script src="./composer-effects.js" defer></script>
</head>

<body>
    <header class="app-header">
        <div class="brand"><span class="brand-mark" aria-hidden="true">ϟ</span>Aether</div>

        <nav class="dock" aria-label="Navigation preview">
            <span class="dock-bubble" aria-hidden="true"></span>

            <button type="button" class="dock-tab" data-tab="command" aria-pressed="true">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect class="icon-tile" x="2" y="4" width="20" height="16" rx="3" />
                    <rect class="icon-frame" x="2" y="4" width="20" height="16" rx="3" />
                    <path d="m7 9 3 3-3 3M13 15h4" />
                </svg>
                Command
            </button>

            <button type="button" class="dock-tab" data-tab="files" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path class="icon-tile" d="M3 6h7l2 2h9v11H3Z" />
                    <path d="M3 6h7l2 2h9v11H3Z" />
                </svg>
                Files
            </button>

            <button type="button" class="dock-tab" data-tab="routines" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect class="icon-tile" x="2" y="2" width="20" height="20" rx="6" />
                    <path class="routine-arrow" d="M5 10V8h13m-3-3 3 3-3 3" />
                    <path class="routine-arrow" d="M19 14v2H6m3-3-3 3 3 3" />
                </svg>
                Routines
            </button>

            <button type="button" class="dock-tab" data-tab="history" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect class="icon-tile" x="2" y="2" width="20" height="20" rx="6" />
                    <path d="M5 10a7 7 0 1 1 1 6M5 6v4h4" />
                    <path class="clock-hand" d="M12 8v4l3 2" />
                </svg>
                History
            </button>

            <button type="button" class="dock-tab" data-tab="tools" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect class="icon-tile" x="2" y="2" width="20" height="20" rx="6" />
                    <path class="toolbox-lid" d="M9 8V6h6v2M5 11V8h14v3" />
                    <path d="M5 12h14v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1Zm6 2.5h2" />
                </svg>
                Tools
            </button>

            <button type="button" class="dock-tab" data-tab="settings" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect class="icon-tile" x="2" y="2" width="20" height="20" rx="6" />
                    <path
                        d="m10 5-.5 2-1.8 1-2-.6-1.7 3 1.5 1.6v2L4 15.6l1.7 3 2-.6 1.8 1 .5 2h3.5l.5-2 1.8-1 2 .6 1.7-3-1.5-1.6v-2l1.5-1.6-1.7-3-2 .6-1.8-1-.5-2Z"
                        transform="translate(0 -1)" />
                    <circle cx="11.75" cy="12" r="2.35" />
                </svg>
                Settings
            </button>
        </nav>
        <div class="bg-header-controls">
            <button id="choose-background" type="button">Choose background</button>
            <input id="background-file" type="file" accept="image/*" hidden>
            
            <!-- New Crop Settings Wrapper -->
            <div class="bg-crop-wrapper" id="bg-crop-wrapper" hidden>
                <button id="bg-toggle-btn" type="button" aria-label="Adjust Background">
                    <!-- Crop Icon -->
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2v14a2 2 0 0 0 2 2h14"></path>
                        <path d="M18 22V8a2 2 0 0 0-2-2H2"></path>
                    </svg>
                </button>
                
                <!-- Floating Glass Panel -->
                <div id="bg-panel" hidden>
                    <div class="slider-group">
                        <label for="bg-position-y">Vertical</label>
                        <input type="range" id="bg-position-y" min="0" max="100" value="50">
                    </div>
                    <div class="slider-group">
                        <label for="bg-position-x">Horizontal</label>
                        <input type="range" id="bg-position-x" min="0" max="100" value="50">
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main id="command-scene">
        <section class="command-stack" aria-labelledby="command-heading">
            <div class="intro">
                <h1 id="command-heading">Command</h1>
                <p>Find a local file or carry out a supported task on your PC.</p>
            </div>

            <div class="composer-glass">
                <form id="composer-form">
                    <label class="sr-only" for="command-input">Command input</label>
                    <textarea id="command-input" rows="1"
                        placeholder="Ask Aether to find a file or do a task…"></textarea>

                    <!-- Run Button (Arrow) -->
                    <button id="run-btn" type="submit" disabled aria-label="Run command">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 19V5M5 12l7-7 7 7" />
                        </svg>
                    </button>

                    <!-- Stop Button (Square) -->
                    <button id="stop-btn" type="button" hidden aria-label="Stop">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="6" width="12" height="12" rx="2" />
                        </svg>
                    </button>
                </form>
            </div>

            <section id="examples" aria-labelledby="examples-heading">
                <h2 id="examples-heading">Examples</h2>
                <div class="example-list">
                    <button type="button" data-example="Find a file about Friday lab attendance">
                        Find a file about Friday lab attendance
                    </button>
                    <button type="button" data-example="Convert an attendance CSV to Excel">
                        Convert an attendance CSV to Excel
                    </button>
                </div>
            </section>

            <section id="run-panel" aria-labelledby="run-heading" hidden>
                <div class="run-header">
                    <h2 id="run-heading">Preview run</h2>
                </div>
                <p id="run-status" role="status"></p>
            </section>
        </section>
    </main>
</body>

</html>
